<!DOCTYPE html>
<html lang="vi">

        body {

        }

        img {
            width: 300px;
            margin-top: 20px;
        }

        .name {
            font-size: 26px;
            font-weight: bold;
            margin: 10px;
        }

        .price {
            color: red;
            font-size: 24px;
        }
    </style>
</head>
<body>
<title>Nguyên Khôi trade</title>
<link rel="stylesheet" href="style.css">

<header>
    <h1>Công ty TNHH Nguyên Khôi</h1>

</header>


<nav>
    <a href="index.html">Trang chủ</a>
    <a href="giohang.html">Giỏ hàng</a>

    <div class="dropdown">
        <button class="dropbtn">Sản phẩm</button>

        <a href="login.html">Đăng nhập</a>

</nav>

<h1>Chi tiết sản phẩm</h1>
<img id="img">

<div class="name" id="name"></div>
<div class="price" id="price"></div>

<script>
    const params = new URLSearchParams(window.location.search);

    const name = params.get("name");
    const price = params.get("price");
    const img = params.get("img");

    document.getElementById("name").innerText = name;
    document.getElementById("price").innerText = price + "đ";
    document.getElementById("img").src = img;
</script>
<button onclick="goHome()">⬅ Quay lại trang chủ</button>
<button onclick="addToCart()">Thêm vào giỏ hàng</button>
<button onclick="goCart()">Xem giỏ hàng</button>

<script>
    function addToCart() {
        let product = {
            name: name,
            price: price,
            img: img,
            quantity: 1
        };

        // Lấy giỏ hàng từ localStorage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let found = cart.find(item => item.name === name);

        if(found){
            found.quantity++;
        }else{
            cart.push({
                name: name,
                price: price,
                img: img,
                quantity: 1
            });
        }

        // Lưu lại
        localStorage.setItem("cart", JSON.stringify(cart));

        alert("Đã thêm vào giỏ hàng!");
    }

    function goCart() {
        window.location.href = "giohang.html";
    }
</script>
<script>
    function goHome() {
        window.location.href = "index.html";
    }
</script>

<script>

    let user = localStorage.getItem("user");

    if(user){

        document.getElementById("user-info").innerHTML =
            "Xin chào, " + user + " | <a href='#' onclick='logout()'>Đăng xuất</a>";

    }else{

        document.getElementById("user-info").innerHTML =
            "<a href='dangnhap.html'>Đăng nhập</a>";

    }

    function logout(){

        localStorage.removeItem("user");

        location.reload();

    }

</script>
</body>
